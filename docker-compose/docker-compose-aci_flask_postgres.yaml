apiVersion: 2019-12-01
location: polandcentral
name: aci_flask_postgres 
properties:
  containers:
  - name: postgres
    properties:
      image: postgres
      environmentVariables:
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_USER 
          value: postgres
        - name: POSTGRES_PASSWORD
          value: mysecretpassword
      ports:
        - port: 5432
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5
      volumeMounts:
      - mountPath: /docker-entrypoint-initdb.d
        name: postgres-dbmodel
  - name: flask
    properties:
      image: campnou/flask-bets-postgres
      command: 
        - gunicorn
        - --bind=0.0.0.0:80
        - create_app:app
      environmentVariables:
        - name: FLASK_AZURE_KEY_VAULT
          value: False
        - name: FLASK_CONFIG_FILE 
          value: DevelopmentConfig
        - name: PYTHONUNBUFFERED
          value: True
        - name: FLASK_POSTGRES_HOST 
          value: localhost
      ports:
        - port: 80
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5   
  osType: Linux
  restartPolicy: Never
  ipAddress:
    type: Public
    ports:
    - port: 80
    - port: 5432
  volumes:
  - name: postgres-dbmodel
    azureFile:
     sharename: postgres-startup-scripts
     storageAccountName: flaskbets
     storageAccountKey: <your_storage_account_key>
type: Microsoft.ContainerInstance/containerGroups
