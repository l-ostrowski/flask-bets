version: "3.7"

services:

  nginx:
    container_name: nginx 
    build: ./nginx
    restart: always
    ports:
     - "3000:80"

  flask:
      container_name: flask
      build: ./flask
      command: gunicorn --bind=0.0.0.0:8000 create_app:app
      environment:
        FLASK_AZURE_KEY_VAULT: False
        FLASK_CONFIG_FILE: DevelopmentConfig
        PYTHONUNBUFFERED: True   
      links: 
          - nginx  