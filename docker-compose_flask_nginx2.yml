version: "3.8"

services:

  nginx:
    container_name: nginx 
    build: ./nginx
    restart: always
    ports:
     - "80:80"

  flask:
      container_name: flask
      image: campnou/flask-bets3
      environment:
        FLASK_AZURE_KEY_VAULT: "False"
        FLASK_CONFIG_FILE: DevelopmentConfig
        PYTHONUNBUFFERED: "True"
        FLASK_DB_ENGINE: SQLite3
      links: 
          - nginx  